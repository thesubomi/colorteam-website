<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorteam Brand Studio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="ds/tokens/fonts.css">
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="ds/_ds_bundle.js"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app/config.js"></script>
<script src="app/backend.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0C2621;color:#fff;font-family:var(--font-sans),Inter,sans-serif;font-size:15px;line-height:1.45}
a{color:#A8FC78}a:hover{color:#C4F298}
button{font:inherit;color:inherit;cursor:pointer}
.hint{color:#929A92;font-size:13px;margin:0}
.txt-btn{background:none;border:0;color:#D5E9A8;font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.txt-btn:hover{color:#A8FC78}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#A8FC78;color:#0C2621;font-size:11px;font-weight:700;margin-left:6px}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);background:#203C34}
.login-l{padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative}
.login-h{font-weight:700;letter-spacing:-0.035em;line-height:.92;font-size:clamp(56px,8vw,128px);margin:auto 0 0;color:#A8FC78;text-wrap:balance}
.login-h em{font-family:var(--font-serif),Newsreader,serif;font-weight:400;font-style:normal;color:#fff}
.login-l p{max-width:460px;color:#D5E9A8;margin:0;font-size:17px}
.login-meta{display:flex;justify-content:space-between;font-size:13px;color:#D5E9A8;border-top:1px solid rgba(255,255,255,.22);padding-top:16px}
.login-r{background:#0C2621;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:none}
.login-r h2{margin:0 0 8px;font-size:32px;letter-spacing:-0.03em}
@media(max-width:820px){.login{grid-template-columns:1fr}.login-l,.login-r{padding:32px}}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 24px;background:#0C2621;border-bottom:1px solid rgba(255,255,255,.14);flex-wrap:wrap}
.hdr-l{display:flex;align-items:center;gap:14px}
.hdr-p{font-size:13px;color:#D5E9A8;border-left:1px solid rgba(255,255,255,.22);padding-left:14px}
.nav{display:flex;gap:4px}
.nav-i{background:none;border:0;padding:8px 14px;border-radius:999px;color:#D5E9A8;display:flex;align-items:center}
.nav-i:hover{color:#fff;background:rgba(168,252,120,.08)}
.nav-i.on{background:#A8FC78;color:#0C2621;font-weight:600}
.nav-i.on .cnt{background:#0C2621;color:#A8FC78}
.hdr-r{display:flex;align-items:center;gap:14px}
.seg{display:flex;border:1px solid rgba(168,252,120,.55);border-radius:999px;padding:2px}
.seg button{background:none;border:0;padding:5px 12px;border-radius:999px;font-size:13px;color:#D5E9A8}
.seg button.on{background:rgba(168,252,120,.18);color:#fff}
.av{width:32px;height:32px;border-radius:24%;background:#A8FC78;color:#0C2621;display:grid;place-items:center;font-weight:700}
.studio{display:grid;grid-template-columns:250px minmax(300px,400px) minmax(0,1fr);min-height:calc(100vh - 61px)}
@media(max-width:1100px){.studio{grid-template-columns:220px minmax(0,1fr)}.preview{grid-column:1/-1}}
@media(max-width:700px){.studio{grid-template-columns:1fr}}
.sect-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#A8FC78;margin:22px 0 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sect-h:first-child{margin-top:0}
.sect-h span{text-transform:none;letter-spacing:0;color:#929A92}
.types{padding:22px 14px;border-right:1px solid rgba(255,255,255,.14);background:#0C2621}
.type-list{display:flex;flex-direction:column;gap:2px}
.type{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px;border-radius:10px;text-align:left}
.type:hover{background:rgba(168,252,120,.08)}
.type.on{background:#17483F}
.type-ic{width:34px;height:34px;flex:none;border-radius:24%;display:grid;place-items:center;border:1px solid rgba(168,252,120,.4)}
.type.on .type-ic{background:#A8FC78;border-color:#A8FC78}
.type-tx{display:flex;flex-direction:column;min-width:0}
.type-n{font-size:14px;font-weight:600;line-height:1.2}
.type-s{font-size:11.5px;color:#929A92}
.brief{padding:22px 22px 60px;border-right:1px solid rgba(255,255,255,.14);background:#203C34}
.stack{display:flex;flex-direction:column;gap:14px}
.drop{display:flex;align-items:center;justify-content:center;min-height:110px;border:1px dashed rgba(168,252,120,.55);border-radius:12px;cursor:pointer;overflow:hidden;text-align:center;padding:12px}
.drop:hover{background:rgba(168,252,120,.06)}
.drop span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.drop em{font-style:normal;font-size:12px;color:#929A92}
.drop img{max-height:180px;max-width:100%;border-radius:6px;display:block}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.mood-i,.mood-add{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative}
.mood-i img{width:100%;height:100%;object-fit:cover;display:block}
.mood-i button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:#0C2621;color:#fff;line-height:1;font-size:15px}
.mood-add{display:grid;place-items:center;border:1px dashed rgba(168,252,120,.55);cursor:pointer}
.mood-add:hover{background:rgba(168,252,120,.06)}
.link-row{display:flex;gap:8px;align-items:flex-end}
.link-row>*:first-child{flex:1;min-width:0}
.links{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.links li{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid rgba(255,255,255,.14);padding-top:6px}
.links a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links button{background:none;border:0;color:#929A92}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid rgba(168,252,120,.55);border-radius:2px;padding:7px 10px;font-size:13px;display:flex;gap:6px}
.chip span{color:#929A92}
.chip.on{background:#A8FC78;color:#0C2621;border-color:#A8FC78}
.chip.on span{color:#17483F}
.preview{padding:22px 24px 40px;display:flex;flex-direction:column;min-width:0;background:#0C2621}
.pv-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:none;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-size:13px;color:#D5E9A8;display:flex;align-items:center}
.tab.on{border-color:#A8FC78;color:#fff;background:rgba(168,252,120,.12)}
.pager{display:flex;align-items:center;gap:10px;font-size:13px;color:#D5E9A8;font-variant-numeric:tabular-nums}
.pager button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(168,252,120,.55);background:none;font-size:18px;line-height:1}
.pager button:disabled{opacity:.3;cursor:default}
.pv-box{height:min(62vh,640px);min-height:320px;display:flex;align-items:center;justify-content:center;background:#081A16;border-radius:16px;padding:0;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px}
.pv-box>div{box-shadow:var(--shadow-mockup,0 20px 50px rgba(0,0,0,.4))}
.vars{display:flex;gap:12px;flex-wrap:wrap}
.var{background:none;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#D5E9A8;min-width:136px}
.var>div{margin:auto}
.var.on{border-color:#A8FC78;color:#fff;box-shadow:inset 0 0 0 1px #A8FC78}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:flex-end;border-top:1px solid rgba(255,255,255,.14);padding-top:18px}
.stage{position:fixed;left:-30000px;top:0;pointer-events:none}
.ask{display:flex;gap:18px;align-items:flex-start;margin-bottom:16px}
.ask dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.ask dt{color:#929A92}.ask dd{margin:0}
.page{max-width:1120px;margin:0 auto;padding:40px 24px 80px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.page-h h1{margin:0;font-size:clamp(40px,6vw,72px);letter-spacing:-0.035em;line-height:.92}
.empty{color:#929A92}
.req-list{display:flex;flex-direction:column;border-top:2px solid #A8FC78}
.req{display:flex;gap:20px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.14);align-items:flex-start}
.req>div:first-child{border-radius:6px}
.req-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.req-t{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.req-m{font-size:13px;color:#929A92}
.req-note{margin:6px 0 0;font-size:14px;color:#D5E9A8}
.req-act{display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.req-act>*:first-child{flex:1;min-width:200px}
.req-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media(max-width:700px){.req{flex-wrap:wrap}.req-r{align-items:flex-start}}
.g-h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#A8FC78;font-weight:500;margin:40px 0 14px;border-top:2px solid #A8FC78;padding-top:12px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw-i{border-radius:14px;padding:14px;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:13px}
.sw-i:nth-child(2){box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.g-type{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px}
.g-big{font-size:56px;font-weight:700;letter-spacing:-0.035em;line-height:.92}
.g-big em{font-family:var(--font-serif),Newsreader,serif;font-weight:400;font-style:normal;color:#A8FC78}
.g-type p{color:#929A92;font-size:13px}
.g-logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.g-l{height:140px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.g-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.g-rules h3{margin:0 0 8px;font-size:18px}
.g-rules ul{margin:0;padding-left:18px;color:#D5E9A8;display:flex;flex-direction:column;gap:6px}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#0C2621;border:0;border-radius:999px;padding:13px 18px;font-weight:600;font-size:15px}.g-btn:hover{background:#F3F4EE}.g-btn:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:12px;color:#929A92;font-size:12px}.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.22)}
.err{margin:0;color:#F5E371;font-size:14px}
.login-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.boot{min-height:100vh;display:grid;place-items:center}
img.av{object-fit:cover}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#A8FC78;color:#0C2621;font-weight:600;padding:12px 20px;border-radius:999px;z-index:100;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app/templates.jsx"></script>
<script type="text/babel" src="app/studio.jsx"></script>
<script type="text/babel" src="app/pages.jsx"></script>
</body>
</html>
