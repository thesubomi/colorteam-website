<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Brand Studio · Colorteam</title>
<link rel="icon" href="assets/logo/logo-mark-lime.png">
<link rel="stylesheet" href="ds/tokens/fonts.css">
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="ds/_ds_bundle.js"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="app/config.js"></script>
<script src="app/store.js"></script>
<style>
:root{--sel:#0D99FF;--guide:#F2385A;--ui:var(--font-sans),Inter,system-ui,sans-serif}
:root,[data-theme=light]{--bg:#FAFAF9;--panel:#FFFFFF;--panel-2:#F4F4F2;--canvas:#EFEFEC;--line:#E8E8E5;--line-2:#D7D7D3;--text:#18181B;--text-2:#55555D;--text-3:#8B8B93;--hover:#F1F1EF;--primary:#18181B;--primary-ink:#FFFFFF;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.08);color-scheme:light}
[data-theme=dark]{--bg:#0F0F11;--panel:#18181B;--panel-2:#212125;--canvas:#0B0B0C;--line:#27272B;--line-2:#36363B;--text:#EDEDEF;--text-2:#A6A6AE;--text-3:#73737B;--hover:#232327;--primary:#EDEDEF;--primary-ink:#18181B;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--text);text-underline-offset:2px}a:hover{color:var(--sel)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{margin:0;letter-spacing:-0.015em}
.muted{color:var(--text-3);font-size:12px;margin:0;text-wrap:pretty}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.boot{min-height:100vh;display:grid;place-items:center;align-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font-weight:500;white-space:nowrap;text-decoration:none;transition:background .12s}
.btn:hover{background:var(--hover);color:var(--text)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}.btn.primary:hover{opacity:.88;background:var(--primary);color:var(--primary-ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.xs{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.btn.ghost{border-color:transparent;background:none}.btn.wide{width:100%}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:0;background:none;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.lnk{border:0;background:none;color:var(--text-3);font-size:11px;padding:0}.lnk:hover{color:var(--text)}
.f-in{width:100%;min-width:0;background:var(--panel-2);border:1px solid transparent;border-radius:6px;padding:6px 9px;font:inherit;color:var(--text);outline:none;transition:border-color .12s,background .12s}
.f-in:hover{border-color:var(--line-2)}.f-in:focus{border-color:var(--sel);background:var(--panel)}
textarea.f-in{resize:vertical;line-height:1.45}select.f-in{height:30px}
.fld{display:flex;flex-direction:column;gap:5px}.fld>span{font-size:11px;color:var(--text-2)}.fld em{font-style:normal;font-size:11px;color:var(--text-3)}
.seg{display:inline-flex;background:var(--panel-2);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--text-2)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);padding:2px 8px 2px 7px;border-radius:999px;background:var(--panel-2);white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;background:var(--dot)}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--panel-2);color:var(--text-2);font-size:11px;font-weight:600;margin-left:8px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;object-fit:cover;flex:none;letter-spacing:0}
.bar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
.bar-l,.bar-r{display:flex;align-items:center;gap:8px;min-width:0}
.bar-logo{height:16px;display:block;flex:none}
.bar-app{font-weight:600;padding-left:10px;margin-left:2px;border-left:1px solid var(--line);white-space:nowrap}
.bar-sep{color:var(--text-3)}
.title-in{border:1px solid transparent;background:none;font:inherit;font-weight:600;color:var(--text);padding:4px 6px;border-radius:6px;min-width:80px;width:min(340px,30vw);outline:none;text-overflow:ellipsis}
.title-in:hover{border-color:var(--line-2)}.title-in:focus{border-color:var(--sel)}
.nav{display:flex;gap:2px;margin-left:10px}
.nav button{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--text-2);font-weight:500}
.nav button:hover{color:var(--text);background:var(--hover)}.nav button.on{color:var(--text);background:var(--panel-2)}
.guide-btn{background:#A8FC78;border-color:#A8FC78;color:#0C2621}.guide-btn:hover{background:#C4F298;border-color:#C4F298;color:#0C2621}
@media(max-width:1000px){.guide-btn{font-size:0;gap:0;width:32px;padding:0}}
.me-btn{border:0;background:none;padding:0;border-radius:50%;display:block}
.pres{display:flex;align-items:center;padding:0 6px 0 10px}
.pav{position:relative;border:0;background:none;padding:0;margin-left:-6px;border-radius:50%;display:block}
.pav .av{box-shadow:0 0 0 2px var(--panel)}
.pav.here .av{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--c)}
.pav.on .av{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.pav .dot,.live-av .dot{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#30A46C;box-shadow:0 0 0 2px var(--panel)}
.pcard{display:none;position:absolute;top:calc(100% + 10px);right:-8px;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;text-align:left;flex-direction:column;gap:2px;z-index:40}
.pav:hover .pcard{display:flex}
.pcard b{font-weight:600}.pcard span{color:var(--text-2);font-size:12px}.pcard em{font-style:normal;font-size:11px;color:var(--sel);margin-top:4px}
.pop-wrap{position:relative;display:flex;gap:6px;align-items:center}
.menu,.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:230px;z-index:40}
.pop{padding:12px;width:280px;display:flex;flex-direction:column;gap:10px}
.menu button{display:flex;width:100%;align-items:flex-start;gap:10px;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu button span{display:flex;flex-direction:column}.menu em{font-style:normal;font-size:11px;color:var(--text-3)}
.menu-h{display:flex;flex-direction:column;padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-h span{color:var(--text-2);font-size:12px}.menu-h em{font-style:normal;color:var(--text-3);font-size:11px;margin-top:4px}
.ok-tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--panel-2);color:#30A46C;font-weight:500}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:var(--primary-ink);padding:9px 16px;border-radius:999px;z-index:100;font-weight:500;box-shadow:var(--shadow)}
.ed{display:grid;grid-template-rows:48px minmax(0,1fr);height:100vh}
.ed-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.ed-main{position:relative;min-width:0;min-height:0;display:flex}
.note-b{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 14px;max-width:min(560px,90%);font-size:12.5px}
.follow-tag{position:absolute;top:12px;right:12px;z-index:6;color:#fff;font-weight:500;font-size:12px;padding:5px 10px;border-radius:6px}
.cv{position:relative;flex:1;overflow:hidden;background:var(--canvas);touch-action:none;user-select:none}
.cv.panning{cursor:grabbing}
.cv.following{box-shadow:inset 0 0 0 2px var(--sel)}
.cv-world{position:absolute;left:0;top:0;transform-origin:0 0}
.cv.following .cv-world{transition:transform .14s linear}
.cv-frame{position:absolute;box-shadow:0 0 0 calc(1px / var(--z)) rgba(0,0,0,.06)}
.cv-label{position:absolute;left:0;display:flex;gap:.7em;white-space:nowrap;color:var(--text-2);cursor:pointer;line-height:1.4;overflow:hidden}
.cv-label b{font-weight:500;overflow:hidden;text-overflow:ellipsis}.cv-label span{color:var(--text-3)}.cv-label:hover b{color:var(--sel)}
.ct-layer.live>*{pointer-events:auto;cursor:default}
.ct-layer.live:hover>*{outline:calc(1px / var(--z)) solid var(--sel);outline-offset:0}
.cv-sel{position:absolute;border-style:solid;pointer-events:none;z-index:3}
.cv-fsel{position:absolute;inset:0;border:solid var(--sel);pointer-events:none;z-index:3}
.cv-tag{position:absolute;left:-1px;top:0;transform:translateY(-100%);color:#fff;padding:.1em .5em;border-radius:3px 3px 3px 0;white-space:nowrap;font-weight:500;line-height:1.5}
.cv-h{position:absolute;background:#fff;border:solid var(--sel)}
.cv-h.h0{left:0;top:0;transform:translate(-50%,-50%)}.cv-h.h1{right:0;top:0;transform:translate(50%,-50%)}.cv-h.h2{left:0;bottom:0;transform:translate(-50%,50%)}.cv-h.h3{right:0;bottom:0;transform:translate(50%,50%)}
.cv-guide{position:absolute;background:var(--guide);pointer-events:none;z-index:4}.cv-guide.v{top:0;bottom:0}.cv-guide.h{left:0;right:0}
.cv-cur{position:absolute;transform-origin:0 0;pointer-events:none;transition:left .09s linear,top .09s linear;z-index:8}
.cv-cur svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.cv-cur span{position:absolute;left:14px;top:17px;background:var(--c);color:#fff;font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap}
.cv-zoom{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:var(--shadow);z-index:6}
.cv-zoom button{border:0;background:none;height:26px;min-width:26px;padding:0 6px;border-radius:5px;color:var(--text-2)}.cv-zoom button:hover{background:var(--hover);color:var(--text)}
.cv-zoom span{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;color:var(--text-2);font-size:12px}
.insp{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp-tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.insp-tabs button{border:0;background:none;padding:6px 8px 9px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.insp-tabs button:hover{color:var(--text)}.insp-tabs button.on{color:var(--text);border-bottom-color:var(--text)}
.insp-body{overflow:auto;flex:1;min-height:0}
.sec{padding:14px 14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600}
.xy{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.xy label{display:flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:6px;padding-left:8px}.xy label span{color:var(--text-3);font-size:11px}.xy .f-in{padding-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:none;border-radius:6px;padding:5px 9px;font-size:12px;display:flex;gap:6px;color:var(--text-2)}
.chip span{color:var(--text-3)}.chip.on{border-color:var(--text);color:var(--text)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.theme-c{border:1px solid var(--line);background:none;border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--text-2)}
.theme-c.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel);color:var(--text)}
.theme-th{width:54px;height:54px;display:grid;place-items:center}
.logo-th{background:#fff repeating-conic-gradient(rgba(127,127,127,.12) 0 25%,transparent 0 50%) 0 0/12px 12px}.logo-th img{object-fit:contain!important;padding:8px;box-sizing:border-box}
.doc-in{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;min-height:260px}
.fld .ph-row em{font-style:normal;font-size:11px;color:var(--text-3)}
.ph-row{display:flex;gap:12px;align-items:flex-start}.ph-row .col{gap:6px}
.ph-th{width:84px;height:84px;border-radius:8px;background:var(--panel-2);overflow:hidden;display:grid;place-items:center;flex:none;color:var(--text-3);font-size:11px}
.ph-th img{width:100%;height:100%;object-fit:cover}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lib-i{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel-2) repeating-conic-gradient(rgba(127,127,127,.12) 0 25%,transparent 0 50%) 0 0/16px 16px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.lib-i.dark{background:#1B1B1E}.lib-i.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.lib-i img{max-width:84%;max-height:84%;object-fit:contain}
.lib-ov{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:8px;opacity:0;transition:opacity .12s}
.lib-i:hover .lib-ov,.lib-i:focus-within .lib-ov{opacity:1}
.lib-ov>span{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-ov .btn{background:#fff;color:#18181B;border-color:#fff}.lib-ov .btn.primary{background:#18181B;color:#fff;border-color:#18181B}.lib-ov .btn.ghost{background:none;color:#fff;border-color:transparent}
.sw{display:grid;grid-template-columns:1fr;gap:2px}
.sw-i{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:5px 6px;border-radius:6px;text-align:left}
.sw-i:hover{background:var(--hover)}.sw-i i{width:22px;height:22px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.sw-i code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-3)}
.g-p{margin:0;color:var(--text-2);text-wrap:pretty}.g-p b{color:var(--text);font-weight:600}
.g-ul{margin:0;padding-left:16px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.vers{display:flex;flex-direction:column}
.ver{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ver:first-child{border-top:0}.ver-th{width:44px;height:44px;display:grid;place-items:center;background:var(--panel-2);border-radius:6px}
.ver-b{display:flex;flex-direction:column;min-width:0}.ver-b b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ver-b span{font-size:11px;color:var(--text-3)}
.stage{position:fixed;left:-40000px;top:0;pointer-events:none}
.shell{min-height:100vh;display:flex;flex-direction:column}
.home{width:100%;max-width:1180px;margin:0 auto;padding:36px 28px 80px;display:flex;flex-direction:column;gap:36px}
.home-t{font-size:24px;font-weight:600}
.hs{display:flex;flex-direction:column;gap:14px}
.hs h2{font-size:13px;font-weight:600;display:flex;align-items:center}
.hs-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hs-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{width:200px}
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.live-c{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;text-align:left}
.live-c:hover{border-color:var(--line-2);background:var(--hover)}
.live-av{position:relative;flex:none;display:block}.live-t{display:flex;flex-direction:column;min-width:0;flex:1}
.live-t b{font-weight:600}.live-t span{color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-j{font-size:12px;font-weight:500;color:var(--sel)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tpl-c{display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0;text-align:left}
.tpl-th{aspect-ratio:1;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;margin-bottom:6px;border:1px solid var(--line);transition:border-color .12s}
.tpl-c:hover .tpl-th{border-color:var(--text-3)}
.tpl-c b{font-weight:500}.tpl-c>span:last-child{font-size:11px;color:var(--text-3)}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:14px}
.fc{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;outline:none}
.fc:hover,.fc:focus-visible{border-color:var(--text-3)}
.fc-th{position:relative;height:172px;background:var(--panel-2);display:grid;place-items:center;border-bottom:1px solid var(--line)}
.fc-live{position:absolute;left:8px;top:8px;display:flex}.fc-live .av{margin-right:-5px;box-shadow:0 0 0 2px var(--panel-2)}
.fc-del{position:absolute;right:6px;top:6px;opacity:0;background:var(--panel);width:28px;height:28px}
.fc:hover .fc-del{opacity:1}
.fc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fc-b>b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-m{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3)}
.fc-m>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:calc(100vh - 48px)}
.cal-main{padding:24px 24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
.cal-h{display:flex;justify-content:space-between;align-items:center}.cal-h h1{font-size:20px;font-weight:600}
.cal-grid{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.cal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cal-wd span{padding:8px 10px;font-size:11px;color:var(--text-3);font-weight:500}
.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-d{min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-d:nth-child(7n){border-right:0}.cal-d:nth-last-child(-n+7){border-bottom:0}
